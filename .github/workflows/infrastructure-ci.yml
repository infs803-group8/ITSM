name: Infrastructure CI
on:
  pull_request:
    paths: ["infrastructure/**", ".github/workflows/infrastructure-ci.yml", ".github/workflows/deploy-final.yml"]
  push:
    branches: [main]
    paths: ["infrastructure/**", ".github/workflows/infrastructure-ci.yml", ".github/workflows/deploy-final.yml"]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m ruff check infrastructure/scripts/deploy.py infrastructure/tests
      - run: python -m pytest infrastructure/tests -q
      - shell: pwsh
        run: ./infrastructure/tests/test-smoke.ps1
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - run: terraform fmt -check -recursive infrastructure/terraform
      - run: terraform -chdir=infrastructure/terraform/final init -backend=false
      - run: terraform -chdir=infrastructure/terraform/final validate
      - run: terraform -chdir=infrastructure/terraform/final test
      - run: terraform -chdir=infrastructure/terraform/dev-storage init -backend=false
      - run: terraform -chdir=infrastructure/terraform/dev-storage validate
