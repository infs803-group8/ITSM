name: Docker Build
on:
  pull_request:
    paths: ["backend/**", "frontend/**", ".github/workflows/docker-build.yml"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.component }}
          push: false
          tags: itsm-${{ matrix.component }}:ci
