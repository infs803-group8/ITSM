name: OpenAPI Contract Check
on:
  pull_request:
    paths: ["docs/api/**", "backend/app/**", ".github/workflows/openapi-check.yml"]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml openapi-spec-validator
      - run: openapi-spec-validator docs/api/openapi.yaml
      - run: python backend/scripts/export_openapi.py --contract-only
      - run: git diff --exit-code docs/api/openapi.json
