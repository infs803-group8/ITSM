services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: service_desk
      MYSQL_USER: itsm_app
      MYSQL_PASSWORD: local_only_password
      MYSQL_ROOT_PASSWORD: local_root_password
    ports: ["3306:3306"]
    volumes:
      - mysql-data:/var/lib/mysql
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-plocal_root_password"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql-data:
